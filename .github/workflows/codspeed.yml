name: CodSpeed

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: simulation
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed instrument
        type: choice
        options:
          - simulation
          - walltime
          - simulation,walltime
        default: simulation
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install Dependencies
        run: sfw pnpm install
      - name: Prepare historical controls
        run: |
          git fetch --no-tags origin refs/pull/43/head 8c763e85fdb5a43a33e49d8a0b9cd589bc64cec7
          pnpm exec node benchmarks/prepare-sonar-history.mjs
      - name: Run Benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          runner-version: '4.19.1'
          run: |
            for variant in before first second v3 candidate; do
              pnpm exec vitest bench benchmarks/results/local/sonar-history/$variant/index.bench.ts --run
            done
          mode: ${{ inputs.mode || 'simulation' }}
