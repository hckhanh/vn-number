name: CodSpeed

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: simulation
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed instrument
        type: choice
        options:
          - simulation
          - walltime
          - simulation,walltime
        default: simulation
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchains
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Setup Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile
      - name: Run Benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          runner-version: '5.4.0'
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          run: pnpm bench
          mode: ${{ inputs.mode || 'simulation' }}
