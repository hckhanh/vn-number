name: CodSpeed

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: simulation
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed instrument
        type: choice
        options:
          - simulation
          - walltime
          - simulation,walltime
        default: simulation
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchains
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Setup Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile
      - name: Run Benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          runner-version: '5.5.0'
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          run: pnpm bench
          mode: ${{ inputs.mode || 'simulation' }}
