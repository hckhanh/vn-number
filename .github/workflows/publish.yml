name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install Dependencies
        run: sfw pnpm install
      - name: Update npm
        run: sfw npm install -g npm@latest
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: pnpm release
          commitMode: 'github-api'
          title: 'Release new version'
          commit: 'chore(release): bump new version'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to JSR
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg version "$VERSION" '.version = $version' jsr.json > jsr.json.tmp
          mv jsr.json.tmp jsr.json
          pnpm dlx jsr publish --allow-dirty
        if: steps.changesets.outputs.published == 'true'
