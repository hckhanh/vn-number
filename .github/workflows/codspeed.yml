name: CodSpeed

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall
      - name: Install Dependencies
        run: sfw pnpm install
      - name: Prepare controlled quantities comparison
        run: |
          git fetch --no-tags --depth=1 origin tag vn-number@2.0.5
          node benchmarks/prepare-quantities.mjs
      - name: Compare quantities on this runner
        run: |
          node benchmarks/compare.mjs --filter read/quantities --output benchmarks/results/local/quantities/native.json
          node --interpreted-frames-native-stack --allow-natives-syntax --hash-seed=1 --random-seed=1 --no-opt --predictable --predictable-gc-schedule --expose-gc --no-concurrent-sweeping --max-old-space-size=4096 benchmarks/compare.mjs --filter read/quantities --output benchmarks/results/local/quantities/simulation-flags.json
          cat benchmarks/results/local/quantities/native.json benchmarks/results/local/quantities/simulation-flags.json
      - name: Run Benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          run: |
            set -e
            pnpm vitest bench src/
            pnpm vitest bench benchmarks/results/local/quantities/baseline-seven.bench.ts
            pnpm vitest bench benchmarks/results/local/quantities/candidate-seven.bench.ts
            pnpm vitest bench benchmarks/results/local/quantities/baseline-settled.bench.ts
            pnpm vitest bench benchmarks/results/local/quantities/candidate-settled.bench.ts
          mode: 'simulation'
